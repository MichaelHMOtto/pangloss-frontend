---
deploy_user: pangloss
deploy_group: pangloss
deploy_root: /opt/pangloss2
app_dir: "{{ deploy_root }}/my-pangloss-application"

api_host: "0.0.0.0"
api_port: 8000
frontend_port: 8080

neo4j_container_name: pangloss-neo4j
neo4j_image: neo4j:5-community
neo4j_user: neo4j
neo4j_password: "pangloss-password"
neo4j_database: neo4j

authjwt_secret_key: "change-this-before-production"
entity_base_url: "http://{{ hostvars[groups['backend'][0]].ansible_host }}:{{ api_port }}/entity/"
backend_cors_origins:
  - "http://{{ hostvars[groups['frontend'][0]].ansible_host }}:{{ frontend_port }}"

uv_install_dir: /usr/local/bin
uv_version: "0.8.15"
python_version: "3.13"